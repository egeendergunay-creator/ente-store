<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boys Collection — ENTE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,Helvetica,sans-serif;
color:#24231f;
background:#fff
}

header{
height:75px;
padding:0 6%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #eee
}

.logo{
font-size:27px;
font-weight:700;
letter-spacing:5px;
color:#24231f;
text-decoration:none
}

nav{
display:flex;
gap:22px;
align-items:center
}

nav a{
text-decoration:none;
color:#333;
font-size:10px;
letter-spacing:1px
}

.cart-button{
border:0;
background:none;
cursor:pointer;
font-size:11px;
letter-spacing:1px;
color:#24231f
}

.hero{padding:75px 6% 50px}

.eyebrow{
font-size:10px;
letter-spacing:2px;
color:#888;
margin-bottom:15px
}

.hero h1{
font-size:clamp(38px,6vw,65px);
font-weight:400;
letter-spacing:-2px
}

.description{
margin-top:16px;
font-size:13px;
color:#777
}

.products{
padding:0 6% 85px;
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:35px 20px
}

.product-card{min-width:0}

.product-image{
position:relative;
width:100%;
aspect-ratio:3/4;
background:#f5f4f1;
overflow:hidden
}

.image-track{
width:100%;
height:100%;
display:flex;
overflow-x:auto;
overflow-y:hidden;
scroll-snap-type:x mandatory;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
overscroll-behavior-x:contain;
touch-action:pan-x pan-y;
scrollbar-width:none;
cursor:grab
}

.image-track::-webkit-scrollbar{display:none}

.image-track.is-dragging{
cursor:grabbing;
scroll-snap-type:none;
scroll-behavior:auto
}

.image-track img{
flex:0 0 100%;
width:100%;
height:100%;
object-fit:cover;
display:block;
scroll-snap-align:start;
scroll-snap-stop:always;
user-select:none;
-webkit-user-drag:none;
pointer-events:none
}

.card-dots{
position:absolute;
bottom:15px;
left:0;
right:0;
display:flex;
justify-content:center;
align-items:center;
gap:7px;
z-index:10
}

.card-dot{
width:6px;
height:6px;
min-width:6px;
flex:0 0 6px;
border-radius:20px;
padding:0;
background:rgba(255,255,255,.85);
border:1px solid rgba(50,50,50,.35);
cursor:pointer;
transition:width .35s cubic-bezier(.22,1,.36,1),
flex-basis .35s cubic-bezier(.22,1,.36,1),
background .3s ease,
border-color .3s ease,
transform .3s ease
}

.card-dot.active{
width:21px;
min-width:21px;
flex-basis:21px;
background:#24231f;
border-color:#24231f
}

.card-dot:active{transform:scale(.85)}

.card-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
width:40px;
height:40px;
border-radius:50%;
border:1px solid rgba(255,255,255,.55);
background:rgba(55,55,55,.72);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:21px;
font-weight:500;
cursor:pointer;
z-index:20;
box-shadow:0 2px 12px rgba(0,0,0,.18);
transition:background .25s ease,transform .25s ease
}

.card-arrow:hover{
background:rgba(35,35,35,.9);
transform:translateY(-50%) scale(1.08)
}

.card-arrow.prev{left:12px}
.card-arrow.next{right:12px}
.card-arrow.is-hidden{display:none}

.product-info{padding-top:14px}

.product-info h2{
font-size:13px;
font-weight:400;
line-height:1.5
}

.product-category{
margin-top:6px;
font-size:11px;
color:#888
}

.price{
margin-top:12px;
font-size:13px;
font-weight:600
}

.add-button{
width:100%;
margin-top:13px;
padding:14px 10px;
background:#24231f;
color:white;
border:1px solid #24231f;
font-size:10px;
letter-spacing:1.5px;
cursor:pointer;
transition:.2s
}

.add-button:hover{
background:#fff;
color:#24231f
}

.empty-products{
grid-column:1/-1;
padding:30px 0;
font-size:13px;
color:#888
}

footer{
border-top:1px solid #eee;
padding:30px 6%;
display:flex;
justify-content:space-between;
font-size:10px;
letter-spacing:1px;
color:#888
}

.gallery-overlay{
display:none;
position:fixed;
inset:0;
z-index:1000;
background:rgba(255,255,255,.98);
overflow-y:auto;
padding:25px
}

.gallery-overlay.active{display:block}

.gallery-header{
display:flex;
justify-content:space-between;
align-items:center;
max-width:1100px;
margin:0 auto 25px
}

.gallery-logo{
font-size:22px;
font-weight:700;
letter-spacing:4px
}

.close-gallery{
border:0;
background:none;
font-size:30px;
cursor:pointer
}

.gallery-content{
max-width:850px;
margin:auto
}

.gallery-main{
width:100%;
max-height:72vh;
display:flex;
justify-content:center;
background:#f7f6f3
}

.gallery-main img{
max-width:100%;
max-height:72vh;
object-fit:contain
}

.gallery-thumbnails{
display:flex;
gap:12px;
margin-top:18px
}

.gallery-thumbnails img{
width:75px;
height:95px;
object-fit:cover;
cursor:pointer;
border:1px solid transparent;
opacity:.65
}

.gallery-thumbnails img.selected{
border-color:#222;
opacity:1
}

.gallery-product-info{margin-top:25px}

.gallery-product-info h2{
font-size:16px;
font-weight:400
}

.gallery-product-info p{
font-size:13px;
margin-top:10px
}

.cart-overlay{
display:none;
position:fixed;
inset:0;
z-index:2000;
background:rgba(0,0,0,.35)
}

.cart-overlay.active{display:block}

.cart-panel{
background:#fff;
width:min(420px,100%);
height:100%;
margin-left:auto;
padding:28px;
overflow-y:auto
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #eee;
padding-bottom:20px
}

.cart-header h2{
font-size:17px;
font-weight:400;
letter-spacing:1px
}

.cart-close{
border:0;
background:none;
font-size:26px;
cursor:pointer
}

.cart-item{
display:flex;
gap:15px;
padding:22px 0;
border-bottom:1px solid #eee
}

.cart-item img{
width:85px;
height:110px;
object-fit:cover;
background:#f5f4f1
}

.cart-item-info{flex:1}

.cart-item-info h3{
font-size:12px;
font-weight:400;
line-height:1.5
}

.cart-item-info p{
margin-top:10px;
font-size:12px
}

.remove-button{
margin-top:12px;
border:0;
background:none;
text-decoration:underline;
color:#888;
font-size:11px;
cursor:pointer
}

.cart-total{
display:flex;
justify-content:space-between;
margin-top:25px;
font-size:14px
}

.empty-cart{
padding:35px 0;
font-size:13px;
color:#888
}

@media(max-width:900px){
.products{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media(max-width:700px){
header{
height:65px;
padding:0 5%
}
nav{gap:11px}
nav a{font-size:9px}
.cart-button{font-size:9px}
.hero{padding:55px 5% 40px}
.products{
padding:0 5% 60px;
gap:28px 12px
}
.product-info h2{font-size:11px}
.add-button{
font-size:9px;
padding:12px 5px
}
.gallery-overlay{padding:18px 14px}
.card-arrow{display:none}
}
</style>
</head>

<body>

<header>
<a href="index.html" class="logo">ENTE</a>
<nav>
<a href="index.html">HOME</a>
<a href="girls.html">GIRLS</a>
<a href="boys.html">BOYS</a>
<a href="unisex.html">UNISEX</a>
<button class="cart-button" onclick="openCart()">
BAG (<span id="cartCount">0</span>)
</button>
</nav>
</header>

<section class="hero">
<p class="eyebrow">ENTE COLLECTION / 02</p>
<h1>Boys Collection</h1>
<p class="description">Discover the latest pieces from ENTE.</p>
</section>

<section class="products" id="products"></section>

<footer>
<span>ENTE</span>
<span>© 2026 ENTE</span>
</footer>

<div class="gallery-overlay" id="gallery">
<div class="gallery-header">
<span class="gallery-logo">ENTE</span>
<button class="close-gallery" onclick="closeGallery()">×</button>
</div>
<div class="gallery-content">
<div class="gallery-main">
<img id="mainProductImage" src="" alt="Product image">
</div>
<div class="gallery-thumbnails" id="galleryThumbnails"></div>
<div class="gallery-product-info">
<h2 id="galleryProductName"></h2>
<p id="galleryProductPrice"></p>
</div>
</div>
</div>

<div class="cart-overlay" id="cart">
<div class="cart-panel">
<div class="cart-header">
<h2>YOUR BAG</h2>
<button class="cart-close" onclick="closeCart()">×</button>
</div>
<div id="cartItems"></div>
<div class="cart-total">
<span>TOPLAM</span>
<strong id="cartTotal">0,00 TL</strong>
</div>
</div>
</div>

<script src="products.js"></script>

<script>
/* VARIABLES */

const products =
(typeof ENTE_PRODUCTS !== "undefined" && ENTE_PRODUCTS.boys)
? ENTE_PRODUCTS.boys
: [];

const productContainer = document.getElementById("products");

let activeProduct = null;
let swipeClickBlockedUntil = 0;

/* PRICE */

function formatPrice(price){
return price.toLocaleString("tr-TR",{
minimumFractionDigits:2,
maximumFractionDigits:2
})+" TL";
}

/* PRODUCTS */

function renderProducts(){

if(!products.length){
productContainer.innerHTML =
'<p class="empty-products">Boys Collection ürünleri yakında burada.</p>';
return;
}

productContainer.innerHTML = products.map((product,index)=>`
<article class="product-card">
<div class="product-image" onclick="openProductFromCard(event,${index})">
<div class="image-track">
${product.images.map((img,i)=>`
<img src="${img}" alt="${product.name} - ${i+1}" draggable="false">
`).join("")}
</div>

<div class="card-dots">
${product.images.map((img,i)=>`
<button type="button" class="card-dot ${i===0?'active':''}"
aria-label="Fotoğraf ${i+1}"
onclick="goToProductImage(event,${index},${i})"></button>
`).join("")}
</div>

<button type="button" class="card-arrow prev is-hidden"
onclick="moveProductImage(event,-1)">‹</button>
<button type="button" class="card-arrow next"
onclick="moveProductImage(event,1)">›</button>
</div>

<div class="product-info">
<h2>${product.name}</h2>
<p class="product-category">Boys Collection</p>
<p class="price">${formatPrice(product.price)}</p>
<button class="add-button" onclick="addToCart('${product.id}',event)">
SEPETE EKLE
</button>
</div>
</article>
`).join("");

setupSliders();
}

/* IMAGE INDEX */

function getImageIndex(track){
if(!track.clientWidth) return 0;
const total=track.querySelectorAll("img").length;
if(!total) return 0;
return Math.max(0,Math.min(total-1,
Math.round(track.scrollLeft/track.clientWidth)));
}

/* SLIDER CONTROLS */

function updateSliderControls(track){

const slider=track.closest(".product-image");
if(!slider) return;

const index=getImageIndex(track);
const total=track.querySelectorAll("img").length;

const dots=slider.querySelectorAll(".card-dot");
const prev=slider.querySelector(".card-arrow.prev");
const next=slider.querySelector(".card-arrow.next");

dots.forEach((dot,i)=>{
dot.classList.toggle("active",i===index);
});

if(prev) prev.classList.toggle("is-hidden",total<=1||index===0);
if(next) next.classList.toggle("is-hidden",total<=1||index===total-1);
}

function goToProductImage(event,productIndex,imageIndex){

event.preventDefault();
event.stopPropagation();

const slider=productContainer.children[productIndex];
if(!slider) return;

const track=slider.querySelector(".image-track");
if(!track) return;

track.scrollTo({
left:imageIndex*track.clientWidth,
behavior:"smooth"
});
}

function moveProductImage(event,direction){

event.preventDefault();
event.stopPropagation();

const slider=event.currentTarget.closest(".product-image");
if(!slider) return;

const track=slider.querySelector(".image-track");
if(!track) return;

const current=getImageIndex(track);
const total=track.querySelectorAll("img").length;

const nextIndex=Math.max(0,Math.min(total-1,current+direction));

track.scrollTo({
left:nextIndex*track.clientWidth,
behavior:"smooth"
});
}

/* SLIDER SETUP */

function setupSliders(){

document.querySelectorAll(".image-track").forEach(track=>{

updateSliderControls(track);

track.addEventListener("scroll",()=>{
updateSliderControls(track);
});

let isDragging=false;
let startX=0;
let startScroll=0;
let hasMoved=false;

track.addEventListener("pointerdown",event=>{

if(event.pointerType!=="mouse"||event.button!==0) return;

isDragging=true;
hasMoved=false;
startX=event.clientX;
startScroll=track.scrollLeft;

track.classList.add("is-dragging");
track.setPointerCapture(event.pointerId);
});

track.addEventListener("pointermove",event=>{

if(!isDragging) return;

const distance=event.clientX-startX;

if(Math.abs(distance)>5){
hasMoved=true;
event.preventDefault();
track.scrollLeft=startScroll-distance;
}
});

function stopDragging(){

if(!isDragging) return;

isDragging=false;
track.classList.remove("is-dragging");

if(hasMoved){
swipeClickBlockedUntil=Date.now()+500;
}

updateSliderControls(track);
}

track.addEventListener("pointerup",stopDragging);
track.addEventListener("pointercancel",stopDragging);
track.addEventListener("lostpointercapture",stopDragging);

});
}

/* PRODUCT GALLERY */

function openProductFromCard(event,index){

if(event.target.closest("button")) return;
if(Date.now()<swipeClickBlockedUntil) return;

openGallery(index);
}

function openGallery(index){

activeProduct=products[index];

if(!activeProduct||!activeProduct.images.length) return;

document.getElementById("mainProductImage").src=activeProduct.images[0];
document.getElementById("galleryProductName").textContent=activeProduct.name;
document.getElementById("galleryProductPrice").textContent=formatPrice(activeProduct.price);

document.getElementById("galleryThumbnails").innerHTML=
activeProduct.images.map((img,i)=>`
<img src="${img}" class="${i===0?'selected':''}"
onclick="changeImage(${i})" alt="Product view ${i+1}">
`).join("");

document.getElementById("gallery").classList.add("active");
document.body.style.overflow="hidden";
}

function changeImage(index){

if(!activeProduct) return;

document.getElementById("mainProductImage").src=activeProduct.images[index];

document.querySelectorAll(".gallery-thumbnails img")
.forEach((img,i)=>{
img.classList.toggle("selected",i===index);
});
}

function closeGallery(){
document.getElementById("gallery").classList.remove("active");
document.body.style.overflow="";
}

/* CART — SHARED PERSISTENT STORAGE */

const CART_STORAGE_KEY="enteCart";

function getCart(){

try{
const saved=localStorage.getItem(CART_STORAGE_KEY);
const cart=saved?JSON.parse(saved):[];

return Array.isArray(cart)?cart:[];

}catch(error){
console.error("Sepet okunamadı:",error);
return [];
}
}

function saveCart(cart){

try{

localStorage.setItem(CART_STORAGE_KEY,JSON.stringify(cart));

const check=JSON.parse(localStorage.getItem(CART_STORAGE_KEY));

if(!Array.isArray(check)){
throw new Error("Sepet kaydı doğrulanamadı.");
}

return true;

}catch(error){

console.error("Sepet kaydedilemedi:",error);
alert("Sepet kaydedilemedi. Lütfen tekrar deneyin.");
return false;

}
}

function addToCart(productId,event){

if(event) event.stopPropagation();

const product=products.find(p=>p.id===productId);
if(!product) return;

const cart=getCart();
const existing=cart.find(item=>item.id===productId);

if(existing){
existing.quantity++;
}else{
cart.push({
id:product.id,
name:product.name,
price:product.price,
image:product.images[0],
quantity:1
});
}

if(!saveCart(cart)) return;

updateCart();
openCart();
}

function updateCart(){

const cart=getCart();

const count=cart.reduce((sum,item)=>sum+item.quantity,0);

document.getElementById("cartCount").textContent=count;

const total=cart.reduce((sum,item)=>sum+item.price*item.quantity,0);

const items=document.getElementById("cartItems");

if(cart.length===0){

items.innerHTML='<p class="empty-cart">Your bag is empty.</p>';

}else{

items.innerHTML=cart.map(item=>`
<div class="cart-item">
<img src="${item.image || (item.images && item.images[0]) || ''}" alt="${item.name}">
<div class="cart-item-info">
<h3>${item.name}</h3>
<p>${formatPrice(item.price)}</p>
<p>Adet: ${item.quantity}</p>
<button class="remove-button" onclick="removeFromCart('${item.id}')">
Ürünü kaldır
</button>
</div>
</div>
`).join("");

}

document.getElementById("cartTotal").textContent=formatPrice(total);
}

function removeFromCart(id){

const cart=getCart().filter(item=>item.id!==id);

if(!saveCart(cart)) return;

updateCart();
}

function openCart(){

updateCart();

document.getElementById("cart").classList.add("active");
document.body.style.overflow="hidden";
}

function closeCart(){

document.getElementById("cart").classList.remove("active");
document.body.style.overflow="";
}

/* KEYBOARD */

document.addEventListener("keydown",event=>{

if(event.key==="Escape"){
closeGallery();
closeCart();
}

});

/* CART SYNC */

window.addEventListener("storage",event=>{

if(event.key===CART_STORAGE_KEY){
updateCart();
}

});

/* START */

renderProducts();
updateCart();

</script>
</body>
</html>
