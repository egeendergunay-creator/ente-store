
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENTE | Kids Collection</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #222;
      background: #fff;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 30px;
      letter-spacing: 7px;
      font-weight: 600;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: #333;
      font-size: 12px;
    }

    .hero {
      min-height: 570px;
      background: #e9e5df;
      display: flex;
      align-items: center;
      padding: 8%;
    }

    .hero-content {
      max-width: 450px;
    }

    .hero p {
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 25px;
    }

    .hero a {
      display: inline-block;
      padding: 15px 28px;
      background: #222;
      color: white;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .section {
      padding: 75px 6%;
    }

    .section h2 {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      margin-bottom: 40px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .category {
      min-height: 270px;
      background: #eeeae5;
      display: flex;
      align-items: end;
      padding: 25px;
      font-family: Georgia, serif;
      font-size: 25px;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 45px 20px;
      letter-spacing: 4px;
      font-size: 20px;
    }

    @media(max-width: 600px) {
      header { padding: 0 5%; }
      .logo { font-size: 24px; }
      nav { gap: 12px; }
      nav a { font-size: 10px; }
      .hero { min-height: 470px; }
      .categories { grid-template-columns: 1fr; }
      .category { min-height: 220px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">ENTE</div>
    <nav>
      <a href="#">NEW</a>
      <a href="#">GIRL</a>
      <a href="#">BOY</a>
      <a href="#">COLLECTION</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p>ENTE KIDS COLLECTION</p>
        <h1>Little details.<br>Big stories.</h1>
        <a href="#categories">COLLECTION</a>
      </div>
    </section>

    <section class="section" id="categories">
      <h2>Explore Collection</h2>
      <div class="categories">
        <div class="category">Girls</div>
        <div class="category">Boys</div>
        <div class="category">New Season</div>
      </div>
    </section>
  </main>

  <footer>ENTE</footer>

</body>
</html>
